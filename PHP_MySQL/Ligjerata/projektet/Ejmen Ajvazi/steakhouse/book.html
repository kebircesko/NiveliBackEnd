<div class="bookdiv">
    <input type="datetime-local" class="datetime" id="bookingTime">
    <button onclick="thankYou()" class="secondary">Book</button>
</div>

<br>

<h1 id="thankyou"></h1>

<script>
    var now = new Date();
    var offset = now.getTimezoneOffset();
    var localDate = new Date(now.getTime() - (offset * 60000)).toISOString().slice(0, 16);
    document.getElementById("bookingTime").value = localDate;

    function thankYou() {
      var datetimeInput = document.querySelector('.datetime');
      var thankYouMessage = document.getElementById('thankyou');
      
      var selectedDateTime = datetimeInput.value;
      
      if (selectedDateTime) {
        thankYouMessage.textContent = `Booked for ${new Date(selectedDateTime).toLocaleString()}`;
        thankYouMessage.style.display = 'block';
      } else {
        thankYouMessage.textContent = 'Please select a date and time.';
        thankYouMessage.style.display = 'block';
      }
    }
</script>
